# Compila e publica o MINIME no GitHub Releases.
# Dispara ao enviar uma tag v* (ex.: v1.2.0) ou na mão pela aba Actions.
# O app instalado lê essa Release pra se atualizar sozinho.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cria o rascunho da Release antes dos builds. Sem isso, Windows e Mac criavam cada um a sua
  # ao mesmo tempo e a publicação podia pegar a errada (aconteceu na 1.2.0 e na 1.3.0).
  rascunho:
    name: Criar o rascunho da Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          TAG="v$(node -p "require('./package.json').version")"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -z "$ID" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "MINIME $TAG" --notes "Em preparação."
          else
            echo "Já existe uma Release $TAG (id $ID): os builds enviam pra ela."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows x64
    needs: rascunho
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-ffmpeg -- --win
      - run: npm run fetch-upscale -- --win
      - run: node scripts/make-icon.mjs && node scripts/gen-nsis.mjs
      - run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    name: Mac (Apple Silicon e Intel)
    needs: rascunho
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: sharp da versão Intel (a máquina do GitHub é Apple Silicon)
        run: |
          PKG=node_modules/sharp/package.json
          VIPS=$(node -p "JSON.parse(require('fs').readFileSync('$PKG','utf8')).optionalDependencies['@img/sharp-libvips-darwin-x64']")
          SHARP=$(node -p "JSON.parse(require('fs').readFileSync('$PKG','utf8')).version")
          echo "sharp $SHARP, libvips $VIPS"
          npm install --no-save --force "@img/sharp-darwin-x64@$SHARP" "@img/sharp-libvips-darwin-x64@$VIPS"
      - run: npm run fetch-ffmpeg -- --mac
      - run: npm run fetch-upscale -- --mac
      - run: node scripts/make-icon.mjs
      - run: npx electron-builder --mac dmg zip --arm64 --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Conferir assinatura, FFmpeg e motor de IA do Mac
        run: |
          for a in mac-arm64 mac; do
            APP="dist/$a/MINIME.app"
            [ -d "$APP" ] || continue
            echo "== $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            file "$APP/Contents/Resources/ffmpeg/ffmpeg"
            ls "$APP/Contents/Resources/app.asar.unpacked/node_modules/@img"
            file "$APP/Contents/Resources/upscale/bin/realesrgan-ncnn-vulkan"
            ls "$APP/Contents/Resources/upscale/models"
          done
          dist/mac-arm64/MINIME.app/Contents/Resources/ffmpeg/ffmpeg -hide_banner -encoders | grep -E "videotoolbox|libx264|libwebp"
          dist/mac-arm64/MINIME.app/Contents/Resources/ffmpeg/ffmpeg -hide_banner -decoders | grep -E "hevc|jxl|psd" || true
          node -e "require('./dist/mac-arm64/MINIME.app/Contents/Resources/app.asar.unpacked/node_modules/sharp')().metadata ? console.log('sharp ok') : 0" || true
          dist/mac-arm64/MINIME.app/Contents/Resources/upscale/bin/realesrgan-ncnn-vulkan -h 2>&1 | head -3 || true
          ls -la dist/mac-arm64/MINIME.app/Contents/Resources/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v6/darwin/arm64 || true

  publish:
    name: Publicar a Release
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Conferir os arquivos e tirar do rascunho
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          REL=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq "[.[] | select(.tag_name==\"$TAG\")]")
          COUNT=$(echo "$REL" | jq 'length')
          [ "$COUNT" = "1" ] || { echo "Esperava 1 Release $TAG e achei $COUNT"; exit 1; }
          ID=$(echo "$REL" | jq '.[0].id')
          NAMES=$(echo "$REL" | jq -r '.[0].assets[].name')
          echo "$NAMES"
          for f in latest.yml latest-mac.yml "MINIME-Setup-${TAG#v}.exe" "MINIME-${TAG#v}-mac-arm64.zip" "MINIME-${TAG#v}-mac-x64.zip"; do
            echo "$NAMES" | grep -qx "$f" || { echo "Falta $f na Release"; exit 1; }
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true \
            -f name="MINIME $TAG" \
            -f body="Windows: MINIME-Setup-*.exe (instalador) ou MINIME-Portatil-*.exe (roda sem instalar). Mac (MINIME-*-mac-arm64.dmg pra Apple Silicon, MINIME-*-mac-x64.dmg pra Intel). Veja o README pra liberar o app no Mac na primeira abertura." \
            --jq '"Publicada: \(.html_url)"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
