# Compila e publica o MINIME no GitHub Releases.
# Dispara ao enviar uma tag v* (ex.: v1.2.0) ou na mão pela aba Actions.
# O app instalado lê essa Release pra se atualizar sozinho.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-ffmpeg -- --win
      - run: npm run fetch-upscale -- --win
      - run: node scripts/make-icon.mjs && node scripts/gen-nsis.mjs
      - run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    name: Mac (Apple Silicon e Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: sharp da versão Intel (a máquina do GitHub é Apple Silicon)
        run: |
          PKG=node_modules/sharp/package.json
          VIPS=$(node -p "JSON.parse(require('fs').readFileSync('$PKG','utf8')).optionalDependencies['@img/sharp-libvips-darwin-x64']")
          SHARP=$(node -p "JSON.parse(require('fs').readFileSync('$PKG','utf8')).version")
          echo "sharp $SHARP, libvips $VIPS"
          npm install --no-save --force "@img/sharp-darwin-x64@$SHARP" "@img/sharp-libvips-darwin-x64@$VIPS"
      - run: npm run fetch-ffmpeg -- --mac
      - run: npm run fetch-upscale -- --mac
      - run: node scripts/make-icon.mjs
      - run: npx electron-builder --mac dmg zip --arm64 --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Conferir assinatura, FFmpeg e motor de IA do Mac
        run: |
          for a in mac-arm64 mac; do
            APP="dist/$a/MINIME.app"
            [ -d "$APP" ] || continue
            echo "== $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            file "$APP/Contents/Resources/ffmpeg/ffmpeg"
            ls "$APP/Contents/Resources/app.asar.unpacked/node_modules/@img"
            file "$APP/Contents/Resources/upscale/bin/realesrgan-ncnn-vulkan"
            ls "$APP/Contents/Resources/upscale/models"
          done
          dist/mac-arm64/MINIME.app/Contents/Resources/ffmpeg/ffmpeg -hide_banner -encoders | grep -E "videotoolbox|libx264|libwebp"
          dist/mac-arm64/MINIME.app/Contents/Resources/ffmpeg/ffmpeg -hide_banner -decoders | grep -E "hevc|jxl|psd" || true
          node -e "require('./dist/mac-arm64/MINIME.app/Contents/Resources/app.asar.unpacked/node_modules/sharp')().metadata ? console.log('sharp ok') : 0" || true
          dist/mac-arm64/MINIME.app/Contents/Resources/upscale/bin/realesrgan-ncnn-vulkan -h 2>&1 | head -3 || true
          ls -la dist/mac-arm64/MINIME.app/Contents/Resources/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v6/darwin/arm64 || true

  publish:
    name: Publicar a Release
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tirar do rascunho
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --title "MINIME $TAG" \
            --notes "Windows: MINIME-Setup-*.exe (instalador) ou MINIME-Portatil-*.exe (roda sem instalar). Mac (MINIME-*-mac-arm64.dmg pra Apple Silicon, MINIME-*-mac-x64.dmg pra Intel). Veja o README pra liberar o app no Mac na primeira abertura."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
